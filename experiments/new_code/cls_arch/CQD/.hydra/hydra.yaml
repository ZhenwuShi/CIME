hydra:
  run:
    dir: ${expdir}/${project}/${experiment}/${run_id}/
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
        datefmt: '%d/%m/%y %H:%M:%S'
    handlers:
      console:
        class: rich.logging.RichHandler
        formatter: colorlog
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    filters:
      onlyimportant:
        (): src.tools.logging.LevelsFilter
        levels:
        - CRITICAL
        - ERROR
        - WARNING
      noimportant:
        (): src.tools.logging.LevelsFilter
        levels:
        - INFO
        - DEBUG
        - NOTSET
    formatters:
      verysimple:
        format: '%(message)s'
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
        datefmt: '%d/%m/%y %H:%M:%S'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        datefmt: '%d/%m/%y %H:%M:%S'
      log_colors:
        DEBUG: purple
        INFO: green
        WARNING: yellow
        ERROR: red
        CRITICAL: red
    handlers:
      console:
        class: rich.logging.RichHandler
        formatter: verysimple
        rich_tracebacks: true
      file_out:
        class: logging.FileHandler
        formatter: simple
        filename: logs.out
        filters:
        - noimportant
      file_err:
        class: logging.FileHandler
        formatter: simple
        filename: logs.err
        filters:
        - onlyimportant
    root:
      level: ${logger_level}
      handlers:
      - console
      - file_out
      - file_err
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment=cls_arch
    - run_id=CQD
  job:
    name: train
    chdir: true
    override_dirname: experiment=cls_arch,run_id=CQD
    id: ???
    num: ???
    config_name: train_cls_arch
    env_set:
      WANDB_API_KEY: 1ec7df0917d838809f584224fbbd6215a1a04b3b
      PYOPENGL_PLATFORM: egl
      HYDRA_FULL_ERROR: '1'
      WANDB__SERVICE_WAIT: '300'
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.2'
    cwd: /data2/home/Modelzhenwu1/OmniME-FGW+LM
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data2/home/Modelzhenwu1/OmniME-FGW+LM/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data2/home/Modelzhenwu1/OmniME-FGW+LM/experiments/new_code/cls_arch/CQD
    choices:
      callback: base
      logger: tensorboard
      sampler: variable_conseq
      trainer: base-longer
      machine: server
      model: basic_clip_cls_arch
      model/optim: adamw
      model/losses: basic
      model/motion_condition_encoder: actor
      model/text_encoder: clipenc_sim
      model/denoiser: ditdenoiser_cls_arch
      model/infer_scheduler: ddpm
      model/train_scheduler: ddpm
      data: motionfix
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: rich
      hydra/hydra_logging: rich
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
